[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgraph"
version = "0.1.0"
description = "Agentic fraud investigation on TigerGraph (HHGOA IEEE-CIS challenge)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: drives the console in headless Chromium (python -m pytest -m browser)",
]
